<!--
  SafeCant — moduli/cruscotto/cruscotto.html
  ============================================================================
  Vista Cruscotto (Area 1), la home. Parziale montato dentro
  <section data-route="cruscotto"> di index.html.

  PRINCIPI DI MARKUP (contratto 11.2, progettazione 5 / 10)
   - Lista verbali come <ul role="list"> di <li>; ogni card è un <article>.
   - Azioni come <button> con aria-label che include la data del verbale, così
     lo screen reader annuncia "Modifica verbale del 30/05/2026" (progettazione 5.1).
   - Stato connessione e coda con role="status"/aria-live (annuncio cambiamenti).
   - Modal anteprima (dialog) e conferma elimina (alertdialog), focus-trap dal JS.
   - $refs (modalAnteprima, modalElimina) combaciano con cruscotto.js.

  Il componente x-data="cruscotto" è registrato in alpine-init.js.
  ============================================================================
-->
<div x-data="cruscotto" class="sc-stack sc-stack--loose">

  <!-- =================================================================== -->
  <!-- === BARRA STATO + AZIONE PRIMARIA ================================ -->
  <!-- =================================================================== -->
  <section class="sc-stack" aria-label="Stato e nuova azione">
    <!-- Stato connessione + coda invio. role=status + aria-live: i cambiamenti
         (online/offline, conteggio coda) vengono annunciati senza interrompere. -->
    <div class="sc-row sc-row--between cru-statusbar" role="status" aria-live="polite">
      <span
        class="sc-status"
        :class="{
          'sc-status--online': $store.app.statoRete === 'online',
          'sc-status--offline': $store.app.statoRete === 'offline',
          'sc-status--limitato': $store.app.statoRete === 'limitato'
        }"
      >
        <span class="sc-status__dot" aria-hidden="true"></span>
        <span x-text="etichettaRete($store.app.statoRete)"></span>
      </span>

      <!-- Contatore coda + azione invio. Il bottone "Invia ora" fornisce la
           transient activation richiesta da Web Share: l'invio parte dal tap. -->
      <span class="cru-coda" x-show="$store.app.inCoda > 0" x-cloak>
        <span x-text="$store.app.inCoda"></span>
        <span>in coda</span>
        <button type="button" class="sc-btn sc-btn--secondary cru-coda__invia"
                @click="inviaPrimoInCoda()"
                :disabled="codaInvioInCorso" :aria-disabled="codaInvioInCorso ? 'true' : 'false'"
                aria-label="Invia ora il primo verbale in coda">
          <span x-show="!codaInvioInCorso">Invia ora</span>
          <span x-show="codaInvioInCorso" x-cloak>Invio…</span>
        </button>
      </span>
    </div>

    <!-- Avviso aggiornamento app: compare quando il SW segnala una nuova versione.
         Tocca la funzione globale esposta da index.html per applicare + ricaricare. -->
    <div class="sc-card cru-aggiornamento" x-show="$store.app.aggiornamentoDisponibile" x-cloak role="status">
      <div class="sc-row sc-row--between sc-row--wrap">
        <span>È disponibile una nuova versione di SafeCant.</span>
        <button type="button" class="sc-btn sc-btn--secondary" @click="window.scApplicaAggiornamento && window.scApplicaAggiornamento()">
          Ricarica
        </button>
      </div>
    </div>

    <!-- Azione primaria prominente. -->
    <button
      type="button"
      class="sc-btn sc-btn--primary sc-btn--block"
      @click="nuovoSopralluogo()"
      aria-label="Crea nuovo verbale di sopralluogo"
    >
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Nuovo sopralluogo
    </button>
  </section>

  <!-- =================================================================== -->
  <!-- === LISTA VERBALI ================================================ -->
  <!-- =================================================================== -->

  <!-- Caricamento iniziale: messaggio neutro (la lista compare appena pronta). -->
  <p class="sc-text-muted sc-text-center" x-show="caricamento" x-cloak>Caricamento…</p>

  <!-- Stato vuoto cordiale (progettazione 5.1). -->
  <div class="sc-empty" x-show="vuoto" x-cloak>
    <p class="sc-empty__title">Nessun verbale ancora</p>
    <p>Crea il primo con il pulsante "Nuovo sopralluogo".</p>
  </div>

  <!-- Elenco. role=list esplicito perché alcune reset CSS rimuovono la semantica
       di <ul>. Ogni verbale è un <article> con intestazione e azioni. -->
  <ul role="list" class="sc-stack cru-lista" x-show="!vuoto && !caricamento" x-cloak>
    <template x-for="v in verbali" :key="v.id">
      <li>
        <article class="sc-card cru-card" :aria-label="`Verbale del ${dataCard(v)}`">
          <!-- Riga superiore: data + badge di stato e NC -->
          <div class="sc-row sc-row--between sc-row--wrap cru-card__top">
            <span class="cru-card__data" x-text="dataCard(v)"></span>
            <span class="sc-row cru-card__badges">
              <span class="sc-badge" :class="classeBadge(v.stato)" x-text="etichettaStato(v.stato)"></span>
              <span class="sc-badge sc-badge--nc" x-show="haNc(v)" x-cloak aria-label="Contiene non conformità">
                <span aria-hidden="true">⚠</span> NC
              </span>
            </span>
          </div>

          <!-- Oggetto del verbale -->
          <p class="cru-card__oggetto" x-text="oggettoCard(v)"></p>

          <!-- Azioni: modifica (solo bozza), anteprima (sempre), elimina (solo bozza).
               aria-label include la data per un annuncio non ambiguo. -->
          <div class="sc-row cru-card__azioni">
            <button
              type="button"
              class="sc-iconbtn"
              x-show="eBozza(v)"
              @click="modifica(v)"
              :aria-label="`Modifica verbale del ${dataCard(v)}`"
            >
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <button
              type="button"
              class="sc-iconbtn"
              @click="apriAnteprima(v)"
              :aria-label="`Anteprima verbale del ${dataCard(v)}`"
            >
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>

            <button
              type="button"
              class="sc-iconbtn cru-azione-elimina"
              x-show="eBozza(v)"
              @click="chiediElimina(v)"
              :aria-label="`Elimina verbale del ${dataCard(v)}`"
            >
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </article>
      </li>
    </template>
  </ul>

  <!-- =================================================================== -->
  <!-- === MODAL: ANTEPRIMA ============================================= -->
  <!-- =================================================================== -->
  <template x-if="verbaleAnteprima">
    <div class="sc-overlay" @click.self="chiudiAnteprima()">
      <div
        class="sc-sheet"
        x-ref="modalAnteprima"
        role="dialog"
        aria-modal="true"
        aria-labelledby="cru-anteprima-titolo"
        tabindex="-1"
      >
        <div class="sc-sheet__header">
          <h3 id="cru-anteprima-titolo" class="sc-card__title">Anteprima verbale</h3>
          <button type="button" class="sc-iconbtn" @click="chiudiAnteprima()" aria-label="Chiudi anteprima">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <!-- Contenuto generato in modo SICURO da riepilogoHtml (tutti i valori
             utente escapati nel JS). x-html è accettabile qui perché la stringa
             è costruita da noi con escapeHtml, non da input grezzo. -->
        <div class="cru-anteprima__corpo" x-html="riepilogoHtml(verbaleAnteprima)"></div>
      </div>
    </div>
  </template>

  <!-- =================================================================== -->
  <!-- === MODAL: SELEZIONE CANTIERE ==================================== -->
  <!-- Aperto da nuovoSopralluogo() quando c'è almeno un'anagrafica in IDB. -->
  <!-- L'utente sceglie il cantiere → selezionaCantiereEAvvia() → #editor.  -->
  <!-- =================================================================== -->
  <template x-if="pickerAperto">
    <div class="sc-overlay" @click.self="chiudiPickerCantiere()">
      <div
        class="sc-sheet"
        x-ref="modalPickerCantiere"
        role="dialog"
        aria-modal="true"
        aria-labelledby="cru-picker-titolo"
        tabindex="-1"
      >
        <div class="sc-sheet__header">
          <h3 id="cru-picker-titolo" class="sc-card__title">Scegli il cantiere</h3>
          <button type="button" class="sc-iconbtn" @click="chiudiPickerCantiere()" aria-label="Annulla selezione cantiere">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <p class="sc-field__hint sc-mt-0">
          Su quale cantiere stai facendo il sopralluogo?
        </p>
        <ul role="list" class="cru-picker-lista">
          <template x-for="a in anagrafichePicker" :key="a.cantiereId">
            <li>
              <button
                type="button"
                class="sc-card cru-picker-voce"
                @click="selezionaCantiereEAvvia(a.cantiereId)"
                :aria-label="`Sopralluogo su ${etichettaPicker(a)}`"
              >
                <span x-text="etichettaPicker(a)"></span>
              </button>
            </li>
          </template>
        </ul>
      </div>
    </div>
  </template>

  <!-- =================================================================== -->
  <!-- === MODAL: CONFERMA ELIMINA ====================================== -->
  <!-- =================================================================== -->
  <template x-if="verbaleDaEliminare">
    <div class="sc-overlay" @click.self="annullaElimina()">
      <div
        class="sc-sheet"
        x-ref="modalElimina"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="cru-elimina-titolo"
        aria-describedby="cru-elimina-desc"
        tabindex="-1"
        @keydown.escape="annullaElimina()"
      >
        <div class="sc-stack">
          <h3 id="cru-elimina-titolo" class="sc-card__title">Eliminare il verbale?</h3>
          <p id="cru-elimina-desc">
            Stai per eliminare la bozza del verbale del
            <strong x-text="dataCard(verbaleDaEliminare)"></strong>.
            L'operazione non può essere annullata.
          </p>
          <div class="sc-row sc-row--between">
            <button type="button" class="sc-btn sc-btn--secondary" @click="annullaElimina()">
              Annulla
            </button>
            <button type="button" class="sc-btn sc-btn--danger" @click="confermaElimina()">
              Elimina
            </button>
          </div>
        </div>
      </div>
    </div>
  </template>

</div>
